# SonarQube project configuration for local analysis
# Project key (change if you use a different key on the Sonar server)
sonar.projectKey=fr.univtln.bruno.samples.java101
sonar.projectName=java101
sonar.projectVersion=0.0.1-SNAPSHOT

# Sources and tests
sonar.sources=src/main/java
sonar.tests=src/test/java

# Binaries (used by some analyzers)
sonar.java.binaries=target/classes

# Path to JaCoCo XML report (Sonar expects an XML coverage report)
# Generate with: mvn verify (or mvn org.jacoco:jacoco-maven-plugin:report)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Recognize Lombok-generated elements: treat @lombok.Generated as generated code so Sonar ignores it
sonar.java.generatedCodeAnnotations=lombok.Generated

# Optional: exclude generated sources or specific files from analysis/coverage
# Example: exclude generated code files if you have separate generated files
# sonar.exclusions=**/generated/**
# sonar.coverage.exclusions=**/generated/**

# Notes:
# - This file is intended for local 'sonar-scanner' runs. For CI, set these values in the pipeline
#   or in the SonarQube project settings (recommended).
# - Sonar recognition of generated code works best if Lombok adds the @lombok.Generated annotation.
