name: Build and deploy Maven site to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure mvnw and build-site.sh are executable
        run: |
          chmod +x mvnw || true
          chmod +x build-site.sh || true

      - name: Set reproducible build timestamp
        run: echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build aggregated Maven site with all reports
        run: |
          ./build-site.sh --with-tests
        env:
          MAVEN_OPTS: "-Dproject.build.outputTimestamp=${{ env.BUILD_TIMESTAMP }}"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/staging
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
