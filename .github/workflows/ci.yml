name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    name: Test matrix (Java)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw || true

      - name: Run unit tests and generate coverage
        run: ./mvnw -B test jacoco:report

      - name: Upload test reports and coverage
        uses: actions/upload-artifact@v4
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/jacoco.exec
            target/site/jacoco/**

      - name: Display JVM version
        run: java -XshowSettings:properties -version || true

  # Dedicated Java21 job that produces the artifacts used by the package/site jobs.
  test-21:
    name: Test (Java 21) - artifact producer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw || true

      - name: Run unit tests and generate coverage (Java 21)
        run: ./mvnw -B test jacoco:report

      - name: Upload Java21 test reports and coverage
        uses: actions/upload-artifact@v4
        with:
          name: reports-java-21
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
            target/jacoco.exec
            target/site/jacoco/**

      - name: Display JVM version
        run: java -XshowSettings:properties -version || true

  package:
    name: Package (shaded) on Java 21
    runs-on: ubuntu-latest
    needs: test-21
    strategy:
      matrix:
        java: [21]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw || true

      - name: Download Java 21 test artifacts (jacoco)
        uses: actions/download-artifact@v4
        with:
          name: reports-java-21
          path: target

      - name: Build shaded JAR
        run: ./mvnw -B -Pshadedjar -DskipTests clean package site

      - name: Upload shaded JAR
        uses: actions/upload-artifact@v4
        with:
          name: shaded-jar
          path: |
            target/*withdependencies.jar

      - name: Upload build artifacts (jars, sources, javadoc)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            target/*.jar
            target/*-sources.jar
            target/*-javadoc.jar
            target/dependency-reduced-pom.xml

      - name: Upload generated site for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: target/site

      - name: Display JVM version
        run: java -XshowSettings:properties -version || true

  deploy:
    name: Deploy site to GitHub Pages
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

# Notes for students/maintainers:
# - This workflow uses the Maven Wrapper (./mvnw) included in the repo.
# - The 'test' job runs on Java 21 and 25 and uploads per-JDK reports as artifacts.
# - The 'package' job runs only on Java 21 (after tests) and produces the shaded jar.
# - If desired, change the 'package' job to run on a different JDK or make it depend only on the Java 21 test run.
