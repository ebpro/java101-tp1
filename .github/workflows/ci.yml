name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    name: Test matrix (Java)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw || true

      - name: Set reproducible build timestamp
        run: echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Run unit tests and generate coverage
        run: ./mvnw -B -Dproject.build.outputTimestamp=${{ env.BUILD_TIMESTAMP }} test jacoco:report

      - name: Upload test reports and coverage
        if: ${{ matrix.java != 21 }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-java-${{ matrix.java }}-${{ github.run_id }}
          path: |
            */target/surefire-reports/**
            */target/failsafe-reports/**
            */target/jacoco.exec
            */target/site/jacoco/**
          if-no-files-found: warn

      - name: Display JVM version
        run: java -XshowSettings:properties -version || true

  # Dedicated Java21 job that produces the artifacts used by the package/site jobs.
  test-21:
    name: Test (Java 21) - artifact producer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw || true

      - name: Set reproducible build timestamp
        run: echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Run unit tests and generate coverage (Java 21)
        run: ./mvnw -B -Dproject.build.outputTimestamp=${{ env.BUILD_TIMESTAMP }} test jacoco:report

      - name: Upload Java21 test reports and coverage
        uses: actions/upload-artifact@v4
        with:
          name: reports-java-21-${{ github.run_id }}
          path: |
            */target/surefire-reports/**
            */target/failsafe-reports/**
            */target/jacoco.exec
            */target/site/jacoco/**
          if-no-files-found: warn

      - name: Display JVM version
        run: java -XshowSettings:properties -version || true

  package:
    name: Package (shaded) on Java 21
    runs-on: ubuntu-latest
    needs: test-21
    strategy:
      matrix:
        java: [21]
    # Packaging job: builds shaded jar and site but does not deploy the site (deploy handled by deploy-pages.yml)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw || true

      - name: Set reproducible build timestamp
        run: echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Download Java 21 test artifacts (jacoco)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: reports-java-21-${{ github.run_id }}
          path: .

      - name: Build shaded JAR with reproducible timestamp
        run: ./mvnw -B -Pshadedjar -DskipTests -Dproject.build.outputTimestamp=${{ env.BUILD_TIMESTAMP }} clean package

      - name: Upload shaded JAR
        uses: actions/upload-artifact@v4
        with:
          name: shaded-jar-${{ github.run_id }}
          path: |
            */target/*withdependencies.jar
          if-no-files-found: warn

      - name: Upload build artifacts (jars, sources, javadoc)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: |
            */target/*.jar
            */target/*-sources.jar
            */target/*-javadoc.jar
            */target/dependency-reduced-pom.xml
          if-no-files-found: warn

      - name: Display JVM version
        run: java -XshowSettings:properties -version || true
